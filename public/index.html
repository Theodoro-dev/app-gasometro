<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Gasometro: nivel de gas do botijao, previsao de troca e aviso por WhatsApp.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Gasometro - medicao de gas e aviso no WhatsApp</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ================= Tela de login ================= -->
<section id="tela-login" class="tela-login">
  <div class="login-caixa">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34"><path d="M24 4c5 8-3 11-3 18a9 9 0 0 0 18 0c0-4-2-6-4-9-1 2-3 3-5 3 3-5 2-9-6-12z" fill="currentColor"/><rect x="8" y="34" width="32" height="6" rx="3" fill="currentColor" opacity=".5"/></svg>
      </span>
      <div>
        <h1>Gasometro</h1>
        <p>Medicao de gas do botijao com aviso no WhatsApp</p>
      </div>
    </div>

    <form id="form-login" class="cartao" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="demo@gasometro.app" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" value="gasometro123" required>

      <button class="botao primario" type="submit">Entrar</button>
      <p id="login-erro" class="aviso erro oculto"></p>
      <p class="texto-miudo">Conta de demonstracao ja preenchida. O app fala com a API; a senha do banco nao fica no aplicativo.</p>
    </form>
  </div>
</section>

<!-- ================= App ================= -->
<div id="app" class="app oculto">
  <header class="topo">
    <div class="topo-esq">
      <span class="ponto-status" id="status-conexao" title="estado da API"></span>
      <div>
        <strong id="nome-local">--</strong>
        <span id="email-usuario" class="texto-miudo"></span>
      </div>
    </div>
    <div class="topo-dir">
      <span id="selo-whatsapp" class="selo">WhatsApp</span>
      <button id="botao-sair" class="botao fantasma pequeno" type="button">Sair</button>
    </div>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <nav class="abas" id="abas">
    <button data-rota="inicio" class="aba ativa">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a2 2 0 0 1-2 2h-4v-6H10v6H6a2 2 0 0 1-2-2z"/></svg><span>Inicio</span>
    </button>
    <button data-rota="botijoes" class="aba">
      <svg viewBox="0 0 24 24"><path d="M8 3h8v3l-1 2v11a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V8L8 6z"/></svg><span>Botijoes</span>
    </button>
    <button data-rota="trocar" class="aba">
      <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3 1.5-1.5L21 9l-5.5 5.5L14 13l3-3H4zm16 8H7l3 3-1.5 1.5L3 15l5.5-5.5L10 11l-3 3h13z"/></svg><span>Trocar</span>
    </button>
    <button data-rota="historico" class="aba">
      <svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg><span>Historico</span>
    </button>
    <button data-rota="whatsapp" class="aba">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5 14.1c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1-.9-.3-2.1-1-3.2-2.1-1-1-1.7-2-2-2.9-.3-.8-.2-1.4 0-1.8.2-.4.7-1 1-1.1.2-.1.5-.1.7 0 .2 0 .3.1.5.5l.6 1.4c.1.2 0 .4-.1.5l-.4.5c-.1.2-.2.3 0 .6.2.3.6.8 1 1.1.5.4 1 .6 1.2.7.2.1.4.1.5 0l.6-.7c.2-.2.3-.2.5-.1l1.4.7c.4.2.5.3.5.5 0 .2 0 .8-.2 1.1z"/></svg><span>WhatsApp</span>
    </button>
    <button data-rota="ajustes" class="aba">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4l-2 .4-.6 1.4 1.2 1.7-1.4 1.4-1.7-1.2-1.4.6L14 21h-2l-.4-2-1.4-.6-1.7 1.2-1.4-1.4 1.2-1.7-.6-1.4L3 14v-2l2-.4.6-1.4L4.4 8.5 5.8 7.1l1.7 1.2 1.4-.6L10 3h2l.4 2 1.4.6 1.7-1.2 1.4 1.4-1.2 1.7.6 1.4L21 10z"/></svg><span>Ajustes</span>
    </button>
  </nav>

  <div id="toast" class="toast oculto"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
